name: Sample Classifier Reports

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sample-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate sample reports
        run: npm run analyze -- examples/cypress-locator-failure.log --json output/result.json --markdown output/report.md

      - name: Upload sample reports
        uses: actions/upload-artifact@v4
        with:
          name: sample-classifier-reports
          path: |
            output/result.json
            output/report.md
          if-no-files-found: error
          retention-days: 7
